# =============================================================================
# Analytical-Intelligence v1 - Sensor Server Stack
# Runs on the sensor machine 
# =============================================================================
#
# REQUIRED environment variables (set in .env):
#   ANALYZER_HOST   - IP or hostname of Analysis server 
#   INGEST_API_KEY  - API key matching Analysis server's INGEST_API_KEY
#   DEVICE_ID       - Unique identifier for this sensor (e.g., sensor-01)
#   HOSTNAME        - Human-readable hostname
#
# OPTIONAL environment variables:
#   NET_IFACE       - Network interface for capture (default: ens33)
#   DEVICE_IP       - Override auto-detected device IP
#   ANALYZER_PORT   - Analysis server port (default: 8000)
#
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Auth Log Collector - Monitors /var/log/auth.log for SSH events
  # ─────────────────────────────────────────────────────────────────────────
  auth_collector:
    build:
      context: ./agents/auth_collector
      dockerfile: Dockerfile
      network: host
    container_name: ai_db-auth-collector
    restart: unless-stopped
    network_mode: host
    environment:
      # Required - will error if not set
      ANALYZER_HOST: ${ANALYZER_HOST:?error - set ANALYZER_HOST in .env}
      INGEST_API_KEY: ${INGEST_API_KEY:?error - set INGEST_API_KEY in .env}
      DEVICE_ID: ${DEVICE_ID:?error - set DEVICE_ID in .env}
      HOSTNAME: ${HOSTNAME:?error - set HOSTNAME in .env}
      # Optional with defaults
      NET_IFACE: ${NET_IFACE:-ens33}
      ANALYZER_PORT: ${ANALYZER_PORT:-8000}
      # Optional override (leave empty for auto-detect)
      DEVICE_IP: ${DEVICE_IP:-}
      TZ: Asia/Kuwait
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - ./agents/common:/app/common:ro

  # ─────────────────────────────────────────────────────────────────────────
  # Suricata IDS - Rule-based intrusion detection
  # ─────────────────────────────────────────────────────────────────────────
  suricata:
    build:
      context: ./services/suricata
      dockerfile: Dockerfile
    container_name: ai_db-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      SURICATA_IFACE: ${NET_IFACE:-ens33}
      MAX_EVE_MB: ${SURICATA_MAX_EVE_MB:-200}
      TZ: Asia/Kuwait
    volumes:
      - ./services/suricata/etc/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./services/suricata/log:/var/log/suricata
      - ./services/suricata/rules:/var/lib/suricata/rules
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -x suricata && test -f /var/log/suricata/stats.log && find /var/log/suricata/stats.log -mmin -2 | grep -q stats.log" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────────────────────────────────────
  # Suricata Collector - Sends alerts to analysis server
  # ─────────────────────────────────────────────────────────────────────────
  suricata_collector:
    build:
      context: ./agents/suricata_collector
      dockerfile: Dockerfile
      network: host
    container_name: ai_db-suricata-collector
    restart: unless-stopped
    network_mode: host
    depends_on:
      - suricata
    environment:
      # Required - will error if not set
      ANALYZER_HOST: ${ANALYZER_HOST:?error - set ANALYZER_HOST in .env}
      INGEST_API_KEY: ${INGEST_API_KEY:?error - set INGEST_API_KEY in .env}
      DEVICE_ID: ${DEVICE_ID:?error - set DEVICE_ID in .env}
      HOSTNAME: ${HOSTNAME:?error - set HOSTNAME in .env}
      # Optional with defaults
      ANALYZER_PORT: ${ANALYZER_PORT:-8000}
      DEVICE_IP: ${DEVICE_IP:-}
      NET_IFACE: ${NET_IFACE:-ens33}
      # Suricata-specific
      SURICATA_EVE_PATH: /var/log/suricata/eve.json
      TZ: Asia/Kuwait
    volumes:
      - ./services/suricata/log:/var/log/suricata:ro
      - ./agents/common:/app/common:ro
      - ./agents/suricata_collector/spool:/app/spool
